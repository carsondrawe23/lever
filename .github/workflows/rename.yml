name: Rename lever to index
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name "carsondrawe23"
          git config user.email "carsondrawe23@gmail.com"
          rm -f index.html
          mv lever.html index.html
          git add -A
          git commit -m "Replace index.html with updated lever.html"
          git push
